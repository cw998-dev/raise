name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      # 无开发者证书：mac 显式走 adhoc 签名（identity: "-"），禁用 runner 上的证书自动发现
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      # renderer 含 Mermaid/KaTeX/Monaco 大量懒加载 chunk；macOS arm64 runner 的 Node 默认约 2GB 堆会 OOM
      NODE_OPTIONS: "--max-old-space-size=4096"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run dist -w packages/desktop -- --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          # 显式只收发布产物：dist/ 里还有 win-unpacked/mac/ 之类未打包目录、.icon-ico 工作目录
          # 和 builder-debug.yml 诊断文件，用 dist/* 通配会把它们一起塞进 release
          path: |
            packages/desktop/dist/*.exe
            packages/desktop/dist/*.zip
            packages/desktop/dist/*.dmg
            packages/desktop/dist/*.AppImage
            packages/desktop/dist/*.blockmap
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" artifacts/* \
            -R "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --notes-file - <<'EOF'
          | Platform | Download |
          | --- | --- |
          | macOS (Apple Silicon) | `raise-mac-arm64.dmg` |
          | macOS (Intel) | `raise-mac-x64.dmg` |
          | Windows (x64) | `raise-windows-x64.exe` (installer) or `raise-windows-x64.zip` (portable) |
          | Linux (x64) | `raise-linux-x86_64.AppImage` |

          Downloads are mirrored on the Gitee release page for notes only — Gitee caps a single attachment at 100 MB, so the binaries stay here.

          > Ad-hoc signed (no Developer ID). On macOS, if Gatekeeper blocks the app, right-click it and choose **Open** (or run `xattr -cr "/Applications/Raise.app"`). These builds ship without an update feed, so updating means downloading the next release here. On Linux, `chmod +x` the AppImage before first launch (and install `libfuse2` on Ubuntu 22.04+/24.04+ if it won't start).
          EOF
  # 刷新官网（raise-website，Cloudflare Pages）：触发 Deploy Hook 重建，同步版本号与 changelog。
  # 需要 repo secret CF_PAGES_DEPLOY_HOOK（Cloudflare Pages → Settings → Builds → Deploy hooks 创建）；未配置时跳过不影响发布
  website:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Cloudflare Pages deploy hook
        env:
          HOOK: ${{ secrets.CF_PAGES_DEPLOY_HOOK }}
        run: |
          if [ -n "$HOOK" ]; then
            curl -fsS -X POST "$HOOK"
          else
            echo "CF_PAGES_DEPLOY_HOOK not set, skipping"
          fi
